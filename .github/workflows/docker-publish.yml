name: Publish Docker image

# Builds the environment-only image (Dockerfile at repo root -- torch/flwr/
# etc. per requirements.txt, no application code copied in; see CLAUDE.md
# and docs/FEDERATED_DESIGN.md §10) and pushes it to Docker Hub as
# ayax911/federal-learning:<tag>, plus :latest.
#
# Automatic trigger: pushing a version tag (v1.2.3 etc.) builds and pushes
# an image tagged to match. Manual trigger (workflow_dispatch) lets you
# publish an arbitrary tag on demand, e.g. from a branch.
#
# Requires two repository secrets (Settings -> Secrets and variables ->
# Actions), set by a repo admin -- this workflow cannot create them:
#   DOCKERHUB_USERNAME  Docker Hub username (ayax911)
#   DOCKERHUB_TOKEN     Docker Hub Personal Access Token (Account Settings
#                       -> Security -> New Access Token; NOT the account
#                       password) with at least Read & Write scope.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v1.2.3, dev)"
        required: true
        default: "manual"

env:
  IMAGE_NAME: ayax911/federal-learning

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

      # Docker Hub repos default to private on some account plans. This
      # makes the repo public after the first successful push so
      # `docker pull ayax911/federal-learning` works with no login. Best
      # effort: the DOCKERHUB_TOKEN needs Read/Write/Delete scope for the
      # PATCH to succeed; if it doesn't, set visibility to Public once by
      # hand in the Docker Hub UI (Repository -> Settings) and this step
      # becomes a harmless no-op on every later run.
      - name: Make Docker Hub repository public
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          JWT=$(curl -s -H "Content-Type: application/json" -X POST \
            -d "{\"username\": \"$DOCKERHUB_USERNAME\", \"password\": \"$DOCKERHUB_TOKEN\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)
          if [ -n "$JWT" ] && [ "$JWT" != "null" ]; then
            curl -s -o /dev/null -w "Docker Hub visibility update: HTTP %{http_code}\n" \
              -H "Authorization: JWT $JWT" -H "Content-Type: application/json" \
              -X PATCH -d '{"is_private": false}' \
              "https://hub.docker.com/v2/repositories/${IMAGE_NAME}/"
          else
            echo "Could not obtain a Docker Hub API token; skipping visibility update."
          fi
