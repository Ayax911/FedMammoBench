experiment_id: exp03_classification_images_frozen_backbone
architecture:
  name: resnet50_radimagenet
  weights_path: /media/imagenesmedicas/DATA1/01-ImagenesMedicas-US1/13-PregradoJulian/Federal
    Learning/infraestructura federada/FedMammoBench/weights/ResNet50.pt
  unfreeze_from: none
head:
  name: configurable_mlp
  hparams:
    in_features: 2048
    hidden_layers:
    - 1024
    - 512
    activation: leakyrelu
    dropout: 0.2
    num_classes: 2
optimizer:
  name: adam
  hparams:
    lr: 0.0001
    betas:
    - 0.5
    - 0.999
scheduler:
  name: cosine
  hparams:
    T_max: 200
    eta_min: 1.0e-06
loss:
  name: cross_entropy
  hparams:
    weight:
    - 3.22
    - 0.59
data:
  manifest_path: manifests/dataset_split_formatted.csv
  image_root: /media/imagenesmedicas/DATA1/01-ImagenesMedicas-US1/13-PregradoJulian/Federal
    Learning/infraestructura federada/FedMammoBench/data
  batch_size: 64
  num_workers: 4
  seed: 42
  image_size:
  - 224
  - 224
  augmentation:
    horizontal_flip: true
    horizontal_flip_p: 0.5
    rotation_degrees: 15
    vertical_flip: true
    vertical_flip_p: 0.2
    blur: true
    blur_p: 0.3
train:
  epochs: 200
  metric_name: f1_macro
  metric_mode: max
  patience: 100
  min_delta: 0.005
  save_every: 10
  checkpoint_dir: runs/exp03_classification_images_frozen_backbone/weights
  run_dir: runs/exp03_classification_images_frozen_backbone
  device: cuda
  wandb_project: fedmammobench2.0
