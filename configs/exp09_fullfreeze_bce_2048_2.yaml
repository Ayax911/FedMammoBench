# exp09_fullfreeze_bce_2048_2 -- Igual que exp07 pero sin pos_weight (todas las clases
# pesan 1.0 por igual). Backbone 100% congelado, cabeza lineal 2048->1 (BCE).
#
# Correr:
#   .venv/bin/python -m src.cli --config configs/exp09_fullfreeze_bce_2048_2.yaml

experiment_id: exp09_fullfreeze_bce_2048_2

architecture:
  name: resnet50_radimagenet
  weights_path: /media/imagenesmedicas/DATA1/01-ImagenesMedicas-US1/13-PregradoJulian/Federal Learning/infraestructura federada/FedMammoBench/weights/ResNet50.pt
  unfreeze_from: none          # backbone 100% congelado = num_freeze=159 del INC

head:
  name: configurable_mlp
  hparams:
    in_features: 2048
    hidden_layers: []
    activation: leakyrelu
    negative_slope: 0.2         # nn.LeakyReLU(0.2) del INC
    dropout: 0.2
    num_classes: 1

optimizer:
  name: adam
  hparams:
    lr: 1.0e-4
    betas: [0.5, 0.999]

scheduler:
  name: cosine
  hparams:
    T_max: 200
    eta_min: 1.0e-6

loss:
  name: bce
  hparams: {}                   # Sin ponderación de clases (sin pos_weight)

data:
  manifest_path: manifests/fedmammobench_norm_neg1_1.csv
  image_root: /media/imagenesmedicas/DATA1/01-ImagenesMedicas-US1/02-Databases/Mammo-Bench/c86fb00c-0fb8-4e0e-85a2-4d415f9c1ada_1a9410d8-9769-4064-a064-0160f2fd193d_DATASET-FILE_Mammo_Bench_zip_20241225112148174/Mammo_Data/Mammo-Bench/preproccesed_julian
  batch_size: 64
  num_workers: 4
  seed: 42
  image_size: null              # Las imágenes ya están a 224x224 en disco
  normalize_mean: null          # Las imágenes ya están normalizadas en [-1, 1]
  normalize_std: null
  augmentation:
    horizontal_flip: true
    horizontal_flip_p: 0.5
    rotation_degrees: 15
    vertical_flip: true
    vertical_flip_p: 0.2
    blur: true
    blur_p: 0.3
  # Desglose de test por base de datos (metrics_by_database.json/.png,
  # confusion_matrix_by_database.png en runs/exp09_fullfreeze_bce_2048_2/test/) -- generados por
  # scripts/split_manifest_by_database.py a partir del mismo manifest TIFF de
  # arriba (norm_neg1_1), sin tocar ninguna imagen. Esta corrida ya había
  # terminado cuando se agregó este campo, así que el desglose se generó
  # después con `src.evaluate` sobre el best checkpoint ya entrenado, no
  # reentrenando (ver CLAUDE.md, "The one command (plus one more for
  # re-evaluation)").
  by_database_manifests:
    cmmd: manifests/by_database/cmmd_norm_neg1_1.csv
    cdd-cesm: manifests/by_database/cdd-cesm_norm_neg1_1.csv
    inbreast: manifests/by_database/inbreast_norm_neg1_1.csv
    kau-bcmd: manifests/by_database/kau-bcmd_norm_neg1_1.csv

train:
  epochs: 200
  metric_name: f1_macro
  metric_mode: max
  patience: 100
  min_delta: 0.005
  save_every: 10
  freeze_bn_stats: false
  checkpoint_dir: runs/exp09_fullfreeze_bce_2048_2/weights
  run_dir: runs/exp09_fullfreeze_bce_2048_2
  device: cuda
  wandb_project: fedmammobench2.0
  wandb_group: bce_freeze_posweight_sweep
