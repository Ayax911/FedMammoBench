# exp29_antioverfit_wd1e2 -- idéntico a exp28_antioverfit_base salvo UN
# cambio: weight_decay 1e-4 -> 1e-2 (100x). Aísla cuánto paga subir el
# weight decay solo, sin tocar LR discriminativo, input_dropout ni loss --
# si el gap train/val AUC de exp28 sigue siendo grande, esta es la primera
# palanca a mover; si exp29 empeora val_loss/AUC, 1e-4 ya era suficiente y el
# gap de exp28 viene de otro lado (LR, épocas, etc.).
#
# Correr:
#   .venv/bin/python -m src.cli --config configs/exp29_antioverfit_wd1e2.yaml

experiment_id: exp29_antioverfit_wd1e2

architecture:
  name: resnet50_imagenet_v2
  unfreeze_from: conv1

head:
  name: configurable_mlp
  hparams:
    in_features: 2048
    hidden_layers: []
    activation: leakyrelu
    negative_slope: 0.2
    dropout: 0.0
    input_dropout: 0.5
    num_classes: 2

optimizer:
  name: adamw
  hparams:
    lr: 1.0e-3
    backbone_lr: 1.0e-4
    betas: [0.9, 0.999]
    weight_decay: 1.0e-2         # ÚNICO CAMBIO vs exp28 (era 1.0e-4)

scheduler:
  name: cosine
  hparams:
    T_max: 80
    eta_min: 1.0e-6

loss:
  name: cross_entropy
  hparams:
    weight: [0.7593, 1.4642]

data:
  manifest_path: manifests/fedmammobench_norm_0_1.csv
  image_root: /media/imagenesmedicas/DATA1/01-ImagenesMedicas-US1/02-Databases/Mammo-Bench/c86fb00c-0fb8-4e0e-85a2-4d415f9c1ada_1a9410d8-9769-4064-a064-0160f2fd193d_DATASET-FILE_Mammo_Bench_zip_20241225112148174/Mammo_Data/Mammo-Bench/preproccesed_julian
  batch_size: 64
  num_workers: 4
  seed: 42
  image_size: null
  normalize_mean: [0.449]
  normalize_std: [0.226]
  augmentation:
    horizontal_flip: true
    horizontal_flip_p: 0.5
    rotation_degrees: 15
    vertical_flip: true
    vertical_flip_p: 0.2
    blur: true
    blur_p: 0.3
  by_database_manifests:
    cmmd: manifests/by_database/cmmd_norm_0_1.csv
    cdd-cesm: manifests/by_database/cdd-cesm_norm_0_1.csv
    inbreast: manifests/by_database/inbreast_norm_0_1.csv
    kau-bcmd: manifests/by_database/kau-bcmd_norm_0_1.csv

train:
  epochs: 80
  metric_name: auc
  metric_mode: max
  patience: 20
  min_delta: 0.001
  save_every: 10
  freeze_bn_stats: true
  checkpoint_dir: runs/exp29_antioverfit_wd1e2/weights
  run_dir: runs/exp29_antioverfit_wd1e2
  device: cuda
  wandb_project: fedmammobench2.0
  wandb_group: antioverfit_regularized
