# exp32_antioverfit_radimagenet -- receta de exp28_antioverfit_base con
# backbone RadImageNet en vez de ImageNet. Control de pretraining sobre una
# arquitectura por fin idéntica en las dos ramas: exp20-23 (la ablación
# original) tenían el Dropout(0.5) hardcodeado desincronizado entre
# corridas (exp20 con DOS capas de más, exp21/22/23 con UNA) y exp22 corría
# sin la normalización ImageNet que su header prometía -- ninguna de esas
# cuatro corridas era comparable entre sí tal como estaban (ver commit
# e7c3340 y diagnóstico 2026-09-08). exp28 y este config sí lo son: mismo
# head/optimizer/scheduler/loss/train, input_dropout explícito en 0.5 en
# ambos, la única diferencia real es architecture + el par manifest/
# normalización que cada backbone requiere.
#
# CUIDADO -- por qué esto NO copia data.manifest_path/normalize_* de
# exp23_pretrain_ablation_radimagenet_all: ese config tiene un bug propio,
# hallado al preparar esta serie (ver diagnóstico 2026-09-08 actualizado) --
# usa fedmammobench_norm_0_1.csv (píxeles [0,1], la convención de ImageNet)
# con normalize_mean/std en null, alimentando su backbone RadImageNet con
# píxeles fuera de la distribución [-1,1] que espera (probablemente
# copy-paste desde exp20/exp22 sin ajustar manifest_path). La convención
# CORRECTA para RadImageNet, la que sí siguen exp05/exp08-16/exp18, es
# fedmammobench_norm_neg1_1.csv (el TIFF ya viene en [-1,1]) con
# normalize_mean/std: null -- la que usa este config.
#
# Correr:
#   .venv/bin/python -m src.cli --config configs/exp32_antioverfit_radimagenet.yaml

experiment_id: exp32_antioverfit_radimagenet

architecture:
  name: resnet50_radimagenet
  weights_path: /media/imagenesmedicas/DATA1/01-ImagenesMedicas-US1/13-PregradoJulian/Federal Learning/infraestructura federada/FedMammoBench/weights/ResNet50.pt
  unfreeze_from: conv1          # full-unfreeze, igual que exp28 -- comparación aislada al
  # pretraining, no a cuánto se reentrena.

head:
  name: configurable_mlp
  hparams:
    in_features: 2048
    hidden_layers: []
    activation: leakyrelu
    negative_slope: 0.2
    dropout: 0.0
    input_dropout: 0.5
    num_classes: 2

optimizer:
  name: adamw
  hparams:
    lr: 1.0e-3
    backbone_lr: 1.0e-4
    betas: [0.9, 0.999]
    weight_decay: 1.0e-4

scheduler:
  name: cosine
  hparams:
    T_max: 80
    eta_min: 1.0e-6

loss:
  name: cross_entropy
  hparams:
    weight: [0.7593, 1.4642]

data:
  manifest_path: manifests/fedmammobench_norm_neg1_1.csv   # RadImageNet espera [-1, 1] -- ver
  # nota arriba sobre por qué NO es norm_0_1 (el bug de exp23).
  image_root: /media/imagenesmedicas/DATA1/01-ImagenesMedicas-US1/02-Databases/Mammo-Bench/c86fb00c-0fb8-4e0e-85a2-4d415f9c1ada_1a9410d8-9769-4064-a064-0160f2fd193d_DATASET-FILE_Mammo_Bench_zip_20241225112148174/Mammo_Data/Mammo-Bench/preproccesed_julian
  batch_size: 64
  num_workers: 4
  seed: 42
  image_size: null
  normalize_mean: null          # ya normalizadas en [-1, 1] -- ver nota arriba
  normalize_std: null
  augmentation:
    horizontal_flip: true
    horizontal_flip_p: 0.5
    rotation_degrees: 15
    vertical_flip: true
    vertical_flip_p: 0.2
    blur: true
    blur_p: 0.3
  by_database_manifests:
    cmmd: manifests/by_database/cmmd_norm_neg1_1.csv
    cdd-cesm: manifests/by_database/cdd-cesm_norm_neg1_1.csv
    inbreast: manifests/by_database/inbreast_norm_neg1_1.csv
    kau-bcmd: manifests/by_database/kau-bcmd_norm_neg1_1.csv

train:
  epochs: 80
  metric_name: auc
  metric_mode: max
  patience: 20
  min_delta: 0.001
  save_every: 10
  freeze_bn_stats: true
  checkpoint_dir: runs/exp32_antioverfit_radimagenet/weights
  run_dir: runs/exp32_antioverfit_radimagenet
  device: cuda
  wandb_project: fedmammobench2.0
  wandb_group: antioverfit_regularized
