# exp57_camilo_centralizado_local -- misma config que exp57_camilo_centralizado.yaml,
# pero con image_root/weights_path apuntando a rutas LOCALES de esta máquina
# (akira) en vez de las del servidor labmirp/Master_Camilo. Ver ese archivo
# para la justificación completa de cada hiperparámetro.
#
# Correr:
#   .venv/bin/python -m src.cli --config configs/exp57_camilo_centralizado_local.yaml

experiment_id: exp57_camilo_centralizado_local

architecture:
  name: resnet50_radimagenet
  weights_path: /home/akira/Descargas/RadImageNet_pytorch/ResNet50.pt
  unfreeze_from: none

head:
  name: configurable_mlp
  hparams:
    in_features: 2048
    hidden_layers: [1024, 512]
    activation: leakyrelu
    negative_slope: 0.2
    dropout: 0.2
    num_classes: 2

optimizer:
  name: adam
  hparams:
    lr: 1.0e-4
    betas: [0.5, 0.999]

scheduler:
  name: cosine
  hparams:
    T_max: 200
    eta_min: 1.0e-6

loss:
  name: cross_entropy
  hparams:
    weight: [0.7593, 1.4642]

data:
  # Manifest sin modificar: preprocessed_image_path ya trae el prefijo
  # "norm_neg1_1/..." -- por eso image_root es el PADRE de norm_neg1_1/,
  # no la carpeta norm_neg1_1/ en sí.
  manifest_path: manifests/fedmammobench_norm_neg1_1.csv
  image_root: /home/akira/snap/steam/preproccesed_julian
  batch_size: 64
  num_workers: 4
  seed: 42
  image_size: null
  normalize_mean: null
  normalize_std: null
  augmentation:
    horizontal_flip: true
    horizontal_flip_p: 0.5
    rotation_degrees: 15
    vertical_flip: true
    vertical_flip_p: 0.2
    blur: true
    blur_p: 0.3
  by_database_manifests:
    cmmd: manifests/by_database/cmmd_norm_neg1_1.csv
    cdd-cesm: manifests/by_database/cdd-cesm_norm_neg1_1.csv
    inbreast: manifests/by_database/inbreast_norm_neg1_1.csv
    kau-bcmd: manifests/by_database/kau-bcmd_norm_neg1_1.csv

train:
  epochs: 200
  metric_name: f1
  metric_mode: max
  patience: 100
  min_delta: 0.005
  save_every: 10
  freeze_bn_stats: false
  checkpoint_dir: runs/centralizado/exp57_camilo_centralizado_local/weights
  run_dir: runs/centralizado/exp57_camilo_centralizado_local
  device: cuda
  wandb_project: fedmammobench2.0
  wandb_group: camilo_hparams_centralizado_vs_inc
