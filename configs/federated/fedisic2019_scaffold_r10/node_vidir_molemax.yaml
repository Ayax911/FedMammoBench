# Nodo vidir_molemax de fedisic2019_scaffold_r10 -- ver server.yaml. alpha = inverso de la proporcion de clase sobre el
# train POOLED de los 6 clientes (mismo vector en todos los nodos, como en el paper).

experiment_id: fedisic2019_scaffold_r10
node_name: vidir_molemax
server_address: "127.0.0.1:8096"
aggregation_scope: full

architecture:
  name: efficientnet_b0_imagenet
  unfreeze_from: features        # fine-tune completo (paper FLamby)

head:
  name: configurable_mlp
  hparams:
    in_features: 1280
    hidden_layers: []
    input_dropout: 0.2           # el dropout(0.2) previo al _fc de efficientnet_pytorch
    num_classes: 8

optimizer:
  name: sgd
  hparams:
    lr: 0.01

scheduler: null

loss:
  name: focal
  hparams:
    gamma: 2.0
    alpha: [5.581333, 2.047226, 7.020385, 26.119382, 9.536923, 101.070652, 92.522388, 38.34433]

data:
  manifest_path: manifests/fed_isic2019/vidir_molemax.csv
  image_root: /home/akira/data/fed_isic2019
  batch_size: 64
  num_workers: 0
  seed: 42
  image_size: 224              # int = preserva aspect ratio con lado corto 224 (como FLamby)
  crop_size: [200, 200]        # RandomCrop(train)/CenterCrop(eval), igual que FLamby
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]
  augmentation:
    horizontal_flip: true
    horizontal_flip_p: 0.5
    vertical_flip: true
    vertical_flip_p: 0.5
    rotation_degrees: 50
    random_scale: true
    random_brightness_contrast: true
    affine: true
    random_crop: true
    coarse_dropout: true

run:
  device: cpu
  freeze_bn_stats: false
  run_dir: runs/federado/fedisic2019_scaffold_r10/nodes/vidir_molemax
  checkpoint_dir: runs/federado/fedisic2019_scaffold_r10/nodes/vidir_molemax/weights
  wandb_project: fedmammobench2.0
  wandb_group: fedisic2019_scaffold_r10
