# Nodo vidir_modern de fedisic2019_fedadam_r10 -- ver server.yaml. alpha = inverso de la proporcion de clase sobre el
# train POOLED de los 6 clientes (mismo vector en todos los nodos, como en el paper).

experiment_id: fedisic2019_fedadam_r10
node_name: vidir_modern
server_address: "127.0.0.1:8093"
aggregation_scope: full

architecture:
  name: efficientnet_b0_imagenet
  unfreeze_from: features        # fine-tune completo (paper FLamby)

head:
  name: configurable_mlp
  hparams:
    in_features: 1280
    hidden_layers: []
    input_dropout: 0.2           # el dropout(0.2) previo al _fc de efficientnet_pytorch
    num_classes: 8

optimizer:
  name: sgd
  hparams:
    lr: 0.01

scheduler: null

loss:
  name: focal
  hparams:
    gamma: 2.0
    alpha: [5.581333, 2.047226, 7.020385, 26.119382, 9.536923, 101.070652, 92.522388, 38.34433]

data:
  manifest_path: manifests/fed_isic2019/vidir_modern.csv
  image_root: /media/lenovo-mirp/TB2/DATA_TB2/04_PregradoJulian/data/fed_isic2019_fedmammobench
  batch_size: 64
  num_workers: 0
  seed: 42
  image_size: 224              # int = preserva aspect ratio con lado corto 224 (como FLamby)
  crop_size: [200, 200]        # RandomCrop(train)/CenterCrop(eval), igual que FLamby
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]
  augmentation:
    horizontal_flip: false       # ver joint_flip: reemplaza H+V independientes
    vertical_flip: false         # por el Flip(p=0.5) combinado real de FLamby
    joint_flip: true
    joint_flip_p: 0.5
    rotation_degrees: 50
    rotation_p: 0.5              # albumentations.Rotate(50) por default (verificado)
    random_scale: true
    random_brightness_contrast: true
    affine: true                 # affine_translate default None = solo shear, como FLamby
    random_crop: true
    coarse_dropout: true

run:
  device: cuda
  freeze_bn_stats: false
  run_dir: runs/federado/fedisic2019_fedadam_r10/nodes/vidir_modern
  checkpoint_dir: runs/federado/fedisic2019_fedadam_r10/nodes/vidir_modern/weights
  wandb_project: research
  wandb_group: fedisic2019_fedadam_r10
  # 6 nodos x EfficientNet-B0 x batch_size=64 (del paper) no entran juntos en
  # los 8GB de VRAM de esta GPU (OOM confirmado, ver
  # docs/FIXES_FEDISIC2019_FLAMBY_REPRO.md). Serializa el forward/backward
  # entre nodos sin tocar batch_size ni la semantica de la ronda federada.
  gpu_lock_path: /tmp/fedisic2019_fedadam_r10_gpu.lock
