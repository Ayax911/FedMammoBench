# exp37_hpsearch_v1_e7u7fprr -- primer config promovido a mano desde
# hpsearch_v1 (sweep hf6m1r5d, bayes+hyperband, 300 trials, ~20.5h, 0 fallos
# reales sobre configs/exp31_antioverfit_no_inputdrop.yaml como base). Ver
# sweeps/hpsearch_v1.yaml para el espacio de búsqueda completo.
#
# Por qué ESTE trial y no el #1 nominal (trial_xfqx634k, val_auc agregado
# 0.9244 vs 0.9212 de este): el val_auc agregado de los 5 mejores trials
# (0.9212-0.9244) queda inflado por selección sobre 300 corridas Y, peor, los
# 5 comparten el mismo punto ciego -- test/metrics_by_database.json de cada
# uno tiene sensibilidad 0.0 en kau-bcmd pese a AUC ~0.9 ahí (kau-bcmd es
# ~4.6% maligno en val, exactamente el escenario que scripts/calibrate_threshold.py
# documenta como su caso de uso). Con el AUC agregado los 5 son indistinguibles
# en ese punto; con la sensibilidad calibrada por base de datos, no:
#
#   scripts/calibrate_threshold.py --by-database (objetivo f1_macro),
#   corrido sobre los 3 candidatos más equilibrados del top-5 (xfqx634k,
#   e7u7fprr, 0lgjpb12):
#
#     kau-bcmd sensibilidad (umbral 0.5 -> calibrado):
#       xfqx634k  0.000 -> 0.167
#       e7u7fprr  0.000 -> 0.333   <- mejor de los 3, y el único con ganancia
#                                     sustancial de f1_macro ahí (0.493 -> 0.657)
#       0lgjpb12  0.000 -> 0.000   <- calibración no ayuda nada (umbral sube a 0.76)
#
#     inbreast sensibilidad (umbral 0.5 -> calibrado):
#       xfqx634k  0.375 -> 0.250
#       e7u7fprr  0.625 -> 0.375   <- mejor de los 3 en ambos umbrales
#       0lgjpb12  0.625 -> 0.125   <- la calibración lo degrada más que a nadie
#
# e7u7fprr generaliza mejor en las dos bases de datos donde el AUC agregado
# SÍ alcanza a diferenciar candidatos (inbreast: 0.633-0.867 de AUC entre el
# top-5; kau-bcmd tras calibrar), a costa de 0.0032 de val_auc agregado
# frente al #1 -- una diferencia que ya está dentro del ruido de selección
# sobre 110 trials evaluados. cdd-cesm y cmmd se comportan de forma similar
# y razonable en los tres, sin diferenciar.
#
# Hiperparámetros que este trial cambia respecto de la base (exp31):
#   hidden_layers   []      -> [512]
#   input_dropout   0.0     -> 0.4468
#   lr              1.0e-3  -> 6.453e-4
#   backbone_lr     1.0e-4  -> 2.096e-4
#   betas[0]        0.9     -> 0.5
#   weight_decay    1.0e-4  -> 3.424e-4
#   label_smoothing 0.0     -> 0.0137
#   epochs / T_max  80      -> 25
# batch_size (64) no cambió -- el sweep lo muestreaba en {32,64,128} y este
# trial cayó en el mismo valor que la base.
#
# Este YAML es el trial_e7u7fprr materializado por scripts/sweep_train.py
# (sweeps/hf6m1r5d/configs/trial_e7u7fprr.yaml), con solo experiment_id,
# run_dir, checkpoint_dir y wandb_group reapuntados a un lugar permanente --
# ningún hiperparámetro se tocó. seed sigue en 42 (heredado de exp31 vía la
# base config; el sweep nunca lo muestrea), así que esta corrida debería
# reproducir metrics.csv/val/test de sweeps/hf6m1r5d/runs/trial_e7u7fprr/
# módulo no-determinismo de cuDNN -- se re-corre de todos modos para que el
# registro de resultados de este experimento viva bajo runs/, no bajo
# sweeps/ (que está en .gitignore y no es el registro commiteado).
#
# Pendiente, no en este commit: réplicas multi-semilla (mismo patrón que
# exp31 -> exp34-36) para separar mejora real de ruido de inicialización, y
# tocar el test set verdadero una sola vez con la config que gane eso.
#
# Correr:
#   .venv/bin/python -m src.cli --config configs/exp37_hpsearch_v1_e7u7fprr.yaml

experiment_id: exp37_hpsearch_v1_e7u7fprr

architecture:
  name: resnet50_imagenet_v2
  unfreeze_from: conv1

head:
  name: configurable_mlp
  hparams:
    in_features: 2048
    hidden_layers: [512]
    activation: leakyrelu
    negative_slope: 0.2
    dropout: 0.0
    input_dropout: 0.446757081317639
    num_classes: 2

optimizer:
  name: adamw
  hparams:
    lr: 0.0006453040132730183
    backbone_lr: 0.00020959745042706368
    betas: [0.5, 0.999]
    weight_decay: 0.0003423573093420121

scheduler:
  name: cosine
  hparams:
    T_max: 25
    eta_min: 1.0e-6

loss:
  name: cross_entropy
  hparams:
    weight: [0.7593, 1.4642]
    label_smoothing: 0.013689308712627246

data:
  manifest_path: manifests/fedmammobench_norm_0_1.csv
  image_root: /media/imagenesmedicas/DATA1/01-ImagenesMedicas-US1/02-Databases/Mammo-Bench/c86fb00c-0fb8-4e0e-85a2-4d415f9c1ada_1a9410d8-9769-4064-a064-0160f2fd193d_DATASET-FILE_Mammo_Bench_zip_20241225112148174/Mammo_Data/Mammo-Bench/preproccesed_julian
  batch_size: 64
  num_workers: 4
  seed: 42
  image_size: null
  normalize_mean: [0.449]
  normalize_std: [0.226]
  augmentation:
    horizontal_flip: true
    horizontal_flip_p: 0.5
    rotation_degrees: 15
    vertical_flip: true
    vertical_flip_p: 0.2
    blur: true
    blur_p: 0.3
  by_database_manifests:
    cmmd: manifests/by_database/cmmd_norm_0_1.csv
    cdd-cesm: manifests/by_database/cdd-cesm_norm_0_1.csv
    inbreast: manifests/by_database/inbreast_norm_0_1.csv
    kau-bcmd: manifests/by_database/kau-bcmd_norm_0_1.csv

train:
  epochs: 25
  metric_name: auc
  metric_mode: max
  patience: 20
  min_delta: 0.001
  save_every: 10
  freeze_bn_stats: true
  checkpoint_dir: runs/exp37_hpsearch_v1_e7u7fprr/weights
  run_dir: runs/exp37_hpsearch_v1_e7u7fprr
  device: cuda
  wandb_project: fedmammobench2.0
  wandb_group: hpsearch_v1_promoted
